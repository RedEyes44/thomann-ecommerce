<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - Thomann Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 Thomann Clone</a>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4">Crea un Account</h3>
                    <div id="messaggio-alert"></div>
                    <form id="formRegistrazione">
                        <div class="mb-3"><input type="text" class="form-control" id="nome" placeholder="Nome" required></div>
                        <div class="mb-3"><input type="text" class="form-control" id="cognome" placeholder="Cognome" required></div>
                        <div class="mb-3"><input type="email" class="form-control" id="email" placeholder="Email" required></div>
                        <div class="mb-4"><input type="password" class="form-control" id="password" placeholder="Password" required></div>
                        <button type="submit" class="btn btn-primary w-100">Registrati</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="javascript/app.js"></script>
</body>
</html>
