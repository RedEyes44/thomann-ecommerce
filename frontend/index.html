<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomann Clone - Catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body> <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 TH-GUITARS</a>
            <div class="d-flex" id="menu-utente">
                <a href="login.html" class="btn btn-outline-light me-2">LOGIN</a>
                <a href="registrazione.html" class="btn btn-outline-light me-2">REGISTRATI</a>
                <a href="carrello.html" class="btn btn-warning">🛒 CARRELLO (0)</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="container">
            <h1 class="hero-title">Forged for Metal</h1>
            <p class="lead text-light fs-4 mt-3">Esplora la nostra collezione di chitarre e bassi ad alte prestazioni.</p>
        </div>
    </div>

    <div class="container mt-5">
        
        <!-- ============================== -->
        <!-- NUOVA BARRA DI RICERCA AVANZATA -->
        <!-- ============================== -->
        <div class="row justify-content-center mb-4">
            <!-- FIX: Aggiunto position-relative qui -->
            <div class="col-md-8 position-relative"> 
                <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-dark text-white border-secondary">🔍</span>
                    <!-- FIX: Aggiunto autocomplete="off" -->
                    <input type="text" id="barra-ricerca" class="form-control bg-dark text-white border-secondary" placeholder="Cerca chitarre, bassi, amplificatori..." style="color: white !important;" autocomplete="off">
                    <button class="btn btn-danger fw-bold px-4" onclick="eseguiRicerca()">CERCA</button>
                </div>
                
                <!-- NUOVO: La tendina dei suggerimenti (inizialmente nascosta con d-none) -->
                <ul id="suggerimenti-ricerca" class="list-group position-absolute w-100 shadow-lg d-none" style="z-index: 1000; top: 100%; border: 1px solid #333;">
                </ul>
            </div>
        </div>

        <!-- BARRA DEI FILTRI (Esistente) -->
        <div class="d-flex justify-content-center mb-5 gap-3 flex-wrap">
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo()">ALL GEAR</button>
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo(1)">ELECTRIC GUITARS</button>
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo(2)">ACOUSTIC GUITARS</button>
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo(3)">BASSES</button>
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo(4)">AMPLIFIERS</button>
        </div>

        <div class="row" id="catalogo">
            <div class="col-12 text-center text-light">
                <p>Caricamento strumenti dal magazzino...</p>
            </div>
        </div>
    </div>

    <script src="javascript/app.js"></script>
</body>
</html>
