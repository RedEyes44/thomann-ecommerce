<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomann Clone - Il tuo negozio di strumenti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sistemiamo le immagini degli strumenti */
    .card-img-top {
        height: 250px;
        object-fit: contain; /* ECCO LA MAGIA: mostra tutta l'immagine senza tagliarla */
        padding: 15px;       /* Diamo un po' di respiro ai bordi */
        background-color: #ffffff; /* Sfondo bianco per far risaltare lo strumento */
    }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">?? Thomann Clone</a>
            <div class="d-flex">
                <a href="login.html" class="btn btn-outline-light me-2">Login</a>
                <a href="registrazione.htm" class="btn btn-warning">?? Carrello (0)</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Il nostro Catalogo</h2>
        
        <div class="row" id="catalogo">
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Caricamento...</span>
                </div>
                <p>Caricamento strumenti dal magazzino...</p>
            </div>
        </div>
    </div>

    <script>
        // Funzione per recuperare e stampare i prodotti
        async function caricaCatalogo() {
            try {
                // 1. Chiamiamo l'API che hai appena creato nel backend
                // Nota: usiamo il percorso relativo per risalire alla cartella api
                const risposta = await fetch('../api/prodotti.php');
                
                // 2. Trasformiamo la risposta in un array JavaScript
                const prodotti = await risposta.json();
                
                // 3. Prendiamo il contenitore vuoto nell'HTML
                const contenitore = document.getElementById('catalogo');
                contenitore.innerHTML = ''; // Svuotiamo il caricamento
                
                // 4. Cicliamo i prodotti e creiamo una "Card" HTML per ognuno
                prodotti.forEach(prodotto => {
                    const cardHTML = `
                        <div class="col-md-4 col-sm-6 mb-4">
                            <div class="card h-100 shadow-sm">
                                <img src="${prodotto.immagine_url}" class="card-img-top" alt="${prodotto.nome}">
                                <div class="card-body d-flex flex-column">
                                    <span class="badge bg-secondary mb-2 w-50">${prodotto.nome_categoria}</span>
                                    <h5 class="card-title">${prodotto.nome}</h5>
                                    <p class="card-text text-muted small">${prodotto.descrizione.substring(0, 60)}...</p>
                                    <h4 class="mt-auto text-primary">� ${prodotto.prezzo}</h4>
                                    <button class="btn btn-success mt-3" onclick="aggiungiAlCarrello(${prodotto.id_prodotto})">
                                        Aggiungi al Carrello
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    // Aggiungiamo la card al contenitore
                    contenitore.innerHTML += cardHTML;
                });
                
            } catch (errore) {
                console.error("Errore di connessione al backend:", errore);
                document.getElementById('catalogo').innerHTML = '<div class="alert alert-danger">Impossibile caricare il catalogo.</div>';
            }
        }

        // Funzione VERA per aggiungere al carrello
        async function aggiungiAlCarrello(idProdotto) {
            try {
                // Facciamo una richiesta POST alla nostra API
                const risposta = await fetch('../api/carrello.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_prodotto: idProdotto })
                });
                
                const risultato = await risposta.json();

                if (risposta.ok) {
                    // Se è andato tutto bene, aggiorniamo il contatore in alto!
                    aggiornaContatoreCarrello();
                    
                    // Un piccolo feedback visivo per l'utente
                    alert("🎸 " + risultato.messaggio); 
                } else {
                    alert("Errore: " + risultato.errore);
                }
            } catch (errore) {
                console.error("Errore aggiunta carrello:", errore);
            }
        }

        // Funzione per leggere quanti pezzi ci sono e aggiornare la Navbar
        async function aggiornaContatoreCarrello() {
            try {
                
                // Cancella questa:
                // const risposta = await fetch('../api/carrello.php');

                // E metti questa. Aggiungiamo un parametro che tira uno schiaffo al browser:
                            
                const risposta = await fetch('../api/carrello.php', { cache: 'no-store' });


                const dati = await risposta.json();
                
                // Troviamo il bottone del carrello (usiamo la classe .btn-warning)
                // e gli cambiamo il testo con il totale degli articoli
                const bottoniCarrello = document.querySelectorAll('.btn-warning'); 
                bottoniCarrello.forEach(btn => {
                    btn.innerHTML = `🛒 Carrello (${dati.totale_articoli})`;
                });
            } catch (errore) {
                console.error("Errore lettura carrello:", errore);
            }
        }



        // Avviamo le funzioni appena la pagina si apre
        caricaCatalogo();
        
        // Prima controlliamo chi è loggato, POI aggiorniamo il carrello
        controllaSessione().then(() => {
            aggiornaContatoreCarrello();
        });



    </script>
</body>
</html>
