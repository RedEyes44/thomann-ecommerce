<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomann Clone - Catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body> <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 TH-GUITARS</a>
            <div class="d-flex" id="menu-utente">
                <a href="login.html" class="btn btn-outline-light me-2">LOGIN</a>
                <a href="registrazione.html" class="btn btn-outline-light me-2">REGISTRATI</a>
                <a href="carrello.html" class="btn btn-warning">🛒 CARRELLO (0)</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="container">
            <h1 class="hero-title">Forged for Metal</h1>
            <p class="lead text-light fs-4 mt-3">Esplora la nostra collezione di chitarre e bassi ad alte prestazioni.</p>
        </div>
    </div>

    <div class="container mt-5">
        
        <!-- ============================== -->
        <!-- PANNELLO RICERCA E ORDINAMENTO -->
        <!-- ============================== -->
        <div class="row justify-content-center mb-4">
            <!-- Barra di ricerca (Occupa 6 colonne su schermi medi) -->
            <div class="col-md-6 position-relative mb-3"> 
                <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-dark text-white border-secondary">🔍</span>
                    <input type="text" id="barra-ricerca" class="form-control bg-dark text-white border-secondary" placeholder="Cerca nel catalogo..." autocomplete="off">
                    <button class="btn btn-danger fw-bold px-4" onclick="eseguiRicerca()">CERCA</button>
                </div>
                <ul id="suggerimenti-ricerca" class="list-group position-absolute w-100 shadow-lg d-none" style="z-index: 1000; top: 100%; border: 1px solid #333;"></ul>
            </div>
            
            <!-- Tendina Ordinamento (Occupa 3 colonne su schermi medi) -->
            <div class="col-md-3 mb-3">
                <select id="filtro-ordine" class="form-select form-select-lg bg-dark text-white border-secondary shadow-sm" onchange="eseguiRicerca()">
                    <option value="nuovi">✨ Ultimi Arrivi</option>
                    <option value="prezzo_asc">💶 Prezzo: Crescente</option>
                    <option value="prezzo_desc">💎 Prezzo: Decrescente</option>
                    <option value="alfabetico">🔤 Nome: A - Z</option>
                </select>
            </div>
        </div>

        <!-- Bottoni Categoria -->
        <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
            <div id="bottoni-categorie" class="d-flex justify-content-center flex-wrap gap-2 my-4">
    </div>
        </div>

        <div class="row" id="catalogo">
            <div class="col-12 text-center text-light">
                <p>Caricamento strumenti dal magazzino...</p>
            </div>
        </div>
    </div>

    <script src="javascript/app.js"></script>
</body>
</html>
