<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomann Clone - Catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body> <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 TH-GUITARS</a>
            <div class="d-flex" id="menu-utente">
                <a href="login.html" class="btn btn-outline-light me-2">LOGIN</a>
                <a href="registrazione.html" class="btn btn-outline-light me-2">REGISTRATI</a>
                <a href="carrello.html" class="btn btn-warning">🛒 CARRELLO (0)</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="container">
            <h1 class="hero-title">Forged for Metal</h1>
            <p class="lead text-light fs-4 mt-3">Esplora la nostra collezione di chitarre e bassi ad alte prestazioni.</p>
        </div>
    </div>

    <div class="container mt-5">
        
        <div class="d-flex justify-content-center mb-5 gap-3 flex-wrap">
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo()">ALL GEAR</button>
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo(1)">ELECTRIC GUITARS</button>
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo(2)">ACOUSTIC GUITARS</button>
            <button class="btn btn-outline-dark px-4 py-2" onclick="caricaCatalogo(3)">BASSES</button>
        </div>

        <div class="row" id="catalogo">
            <div class="col-12 text-center text-light">
                <p>Caricamento strumenti dal magazzino...</p>
            </div>
        </div>
    </div>

    <script>
        // Aggiungiamo 'idCategoria' come parametro opzionale (di default è nullo)
        async function caricaCatalogo(idCategoria = null) {
            try {
                // Costruiamo l'URL. Se c'è una categoria, l'aggiungiamo!
                let urlApi = '../api/prodotti.php';
                if (idCategoria !== null) {
                    urlApi += `?categoria=${idCategoria}`;
                }

                const risposta = await fetch(urlApi);
                const prodotti = await risposta.json();
                const contenitore = document.getElementById('catalogo');
                
                // Se la categoria è vuota (es. ho filtrato per qualcosa che non ho in magazzino)
                if (prodotti.length === 0) {
                    contenitore.innerHTML = '<div class="col-12 text-center text-muted"><h5>Nessun prodotto trovato in questa categoria.</h5></div>';
                    return;
                }

                contenitore.innerHTML = ''; 
                
                prodotti.forEach(prodotto => {
                    contenitore.innerHTML += `
                        <div class="col-md-4 col-sm-6 mb-4">
                            <div class="card h-100 shadow-sm">
                                <a href="prodotto.html?id=${prodotto.id_prodotto}">
                                    <img src="${prodotto.immagine_url}" class="card-img-top" alt="${prodotto.nome}">
                                </a>
                                <div class="card-body d-flex flex-column">
                                    <span class="badge bg-secondary mb-2 w-50">${prodotto.nome_categoria}</span>
                                    <h5 class="card-title">
                                        <a href="prodotto.html?id=${prodotto.id_prodotto}" class="text-decoration-none text-dark">
                                            ${prodotto.nome}
                                        </a>
                                    </h5>
                                    <p class="card-text text-muted small">${prodotto.descrizione.substring(0, 60)}...</p>
                                    <h4 class="mt-auto text-primary">€ ${prodotto.prezzo}</h4>
                                    <button class="btn btn-success mt-3" onclick="aggiungiAlCarrello(${prodotto.id_prodotto})">
                                        Aggiungi al Carrello
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (errore) {
                document.getElementById('catalogo').innerHTML = '<div class="alert alert-danger">Impossibile caricare il catalogo.</div>';
            }
        }

        async function aggiungiAlCarrello(idProdotto) {
            try {
                const risposta = await fetch('../api/carrello.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_prodotto: idProdotto })
                });
                const risultato = await risposta.json();
                if (risposta.ok) {
                    aggiornaContatoreCarrello();
                    alert("🎸 " + risultato.messaggio); 
                } else {
                    alert("Errore: " + risultato.errore);
                }
            } catch (errore) {
                console.error(errore);
            }
        }

        async function aggiornaContatoreCarrello() {
            try {
                const risposta = await fetch('../api/carrello.php', { cache: 'no-store' });
                const dati = await risposta.json();
                const bottoniCarrello = document.querySelectorAll('.btn-warning'); 
                bottoniCarrello.forEach(btn => {
                    btn.innerHTML = `🛒 Carrello (${dati.totale_articoli})`;
                });
            } catch (errore) {
                console.error(errore);
            }
        }

        async function controllaSessione() {
            try {
                const risposta = await fetch('../api/me.php');
                const utente = await risposta.json();
                const menu = document.getElementById('menu-utente');

                // Cerca questo pezzo dentro index.html e aggiornalo così:
                if (utente.loggato) {
                    menu.innerHTML = `
                        <span class="navbar-text text-white me-3">Ciao, <b>${utente.nome}</b>!</span>
                        <a href="ordini.html" class="btn btn-outline-info me-2">I miei Ordini</a>
                        
                        <a href="carrello.html" class="btn btn-warning me-2">🛒 Carrello</a>
                        <button onclick="eseguiLogout()" class="btn btn-danger">Esci</button>
                    `;
                }
            } catch (errore) {}
        }

        async function eseguiLogout() {
            await fetch('../api/logout.php');
            window.location.reload(); 
        }

        caricaCatalogo();
        controllaSessione().then(() => {
            aggiornaContatoreCarrello();
        });

       
    </script>
</body>
</html>
