<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il tuo Carrello - Thomann Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet"> <style>
        .img-carrello { width: 80px; height: 80px; object-fit: contain; background-color: #2a2a2a; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 TH-GUITARS</a>
            <div class="d-flex" id="menu-utente">
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 text-white">Il tuo Carrello 🛒</h2>

        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body" id="lista-carrello">
                        <div class="text-center py-4">
                            <div class="spinner-border text-danger" role="status"></div>
                            <p class="text-white mt-2">Caricamento carrello...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm" style="border-color: #d90429 !important;">
                    <div class="card-body">
                        <h4 class="card-title mb-4 text-white">Riepilogo Ordine</h4>
                        <div class="d-flex justify-content-between mb-3 text-white">
                            <span>Articoli totali:</span>
                            <strong id="totale-articoli">0</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 text-white">Totale:</span>
                            <strong class="fs-4" style="color: #d90429;">€ <span id="totale-euro">0.00</span></strong>
                        </div>
                        
                        <button class="btn btn-success w-100 py-2 fs-5 fw-bold" onclick="eseguiCheckout()" id="btn-checkout" disabled>
                            PROCEDI AL PAGAMENTO
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="javascript/app.js"></script>
</body>
</html>
