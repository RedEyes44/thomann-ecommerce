<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il tuo Carrello - Thomann Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet"> 
    <style>
        .img-carrello { width: 80px; height: 80px; object-fit: contain; background-color: #2a2a2a; }
    </style>
</head>
<body class="bg-dark">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-danger fw-bold" href="index.html">🎸 TH-GUITARS</a>
            <div class="d-flex" id="menu-utente">
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 text-white">Il tuo Carrello 🛒</h2>

        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm border-secondary bg-black">
                    <div class="card-body" id="lista-carrello">
                        <div class="text-center py-4">
                            <div class="spinner-border text-danger" role="status"></div>
                            <p class="text-white mt-2">Caricamento carrello...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm bg-black" style="border-color: #d90429 !important;">
                    <div class="card-body">
                        <h4 class="card-title mb-4 text-white">Riepilogo Ordine</h4>
                        <div class="d-flex justify-content-between mb-3 text-white">
                            <span>Articoli totali:</span>
                            <strong id="totale-articoli">0</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 text-white">Totale:</span>
                            <strong class="fs-4" style="color: #d90429;">€ <span id="totale-euro">0.00</span></strong>
                        </div>
                        
                        <div class="mb-3">
                            <label class="text-white small mb-1">Indirizzo di Spedizione:</label>
                            <input type="text" id="indirizzo-spedizione" class="form-control bg-dark text-white border-secondary" placeholder="Via Roma 1, Milano" required>
                        </div>

                        <div class="mb-4">
                            <label class="text-white small mb-1">Metodo di Pagamento:</label>
                            <select id="metodo-pagamento" class="form-select bg-dark text-white border-secondary">
                                <option value="postepay">Carta PostePay</option>
                                <option value="contrassegno">Contrassegno</option>
                            </select>
                        </div>
                        
                        <button class="btn btn-success w-100 py-2 fs-5 fw-bold" onclick="eseguiCheckout(event)" id="btn-checkout" disabled>
                            PROCEDI AL PAGAMENTO
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalPostepay" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-warning" style="background-color: #1a1a1a;">
          <div class="modal-header border-warning" style="background-color: #ffcc00;">
            <h5 class="modal-title fw-bold text-dark">💳 Sandbox PostePay - Pagamento</h5>
          </div>
          <div class="modal-body p-4 text-white">
            <p class="text-muted small mb-4">Ambiente di test sicuro. Inserisci i dati fittizi per simulare il gateway di pagamento.</p>
            <div class="mb-3">
                <label class="text-warning">Numero Carta PostePay</label>
                <input type="text" class="form-control bg-dark text-white border-secondary mt-1" placeholder="5333 1234 5678 9012" value="5333 0000 0000 0000">
            </div>
            <div class="row mb-3">
                <div class="col-6">
                    <label class="text-warning">Scadenza</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary mt-1" value="12/28">
                </div>
                <div class="col-6">
                    <label class="text-warning">CVV2</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary mt-1" value="123">
                </div>
            </div>
            <div class="text-center mt-4 d-none" id="pp-spinner">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-warning fw-bold">Autorizzazione transazione in corso...</p>
            </div>
          </div>
          <div class="modal-footer border-warning">
            <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">ANNULLA</button>
            <button type="button" class="btn btn-warning fw-bold text-dark" id="btn-paga-sandbox" onclick="elaboraPagamentoFittizio()">PAGA ORA</button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascript/app.js"></script>
</body>
</html>
