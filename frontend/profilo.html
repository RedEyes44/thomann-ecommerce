<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio Profilo - TH-Guitars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-danger">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="index.html">
                🎸 TH-GUITARS
            </a>
            <div class="d-flex align-items-center" id="menu-utente"></div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-white mb-4">Il mio Profilo 👤</h2>
                <div class="card bg-dark border-secondary shadow-lg text-light p-4">
                    <form id="formProfilo">
                        <div class="mb-3">
                            <label class="text-muted small">Nome e Cognome (Non modificabile)</label>
                            <input type="text" id="nome-profilo" class="form-control bg-dark text-secondary border-secondary" disabled>
                        </div>
                        <div class="mb-4">
                            <label class="text-muted small">Email (Non modificabile)</label>
                            <input type="text" id="email-profilo" class="form-control bg-dark text-secondary border-secondary" disabled>
                        </div>
                        
                        <hr class="border-secondary my-4">
                        <h5 class="text-danger fw-bold mb-3">Impostazioni Checkout</h5>
                        
                        <div class="mb-4">
                            <label>Indirizzo di spedizione predefinito</label>
                            <input type="text" id="indirizzo-profilo" class="form-control bg-dark text-white border-secondary" placeholder="Es. Via Roma 1, Milano">
                            <div class="form-text text-muted">Verrà inserito in automatico quando fai un nuovo ordine.</div>
                        </div>

                        <hr class="border-secondary my-4">
                        <h5 class="text-danger fw-bold mb-3">Sicurezza</h5>

                        <div class="mb-4">
                            <label>Cambia Password</label>
                            <input type="password" id="password-profilo" class="form-control bg-dark text-white border-secondary" placeholder="Scrivi una nuova password (opzionale)">
                            <div class="form-text text-muted">Lascia vuoto se non vuoi cambiarla.</div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mt-2">SALVA MODIFICHE</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="javascript/app.js"></script>
</body>
</html>
