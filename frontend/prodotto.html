<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Prodotto - Thomann Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet"> 
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 TH-GUITARS</a>
            <div class="d-flex" id="menu-utente"></div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row p-4 shadow-lg rounded" style="background-color: #1c1c1c; border: 1px solid #333;" id="dettaglio-prodotto">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger"></div>
                <p class="text-white mt-3">Caricamento dettagli strumento...</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idProdotto = urlParams.get('id');

        // ==========================================
        // 1. IL FIX: FUNZIONI DI SESSIONE AGGIUNTE!
        // ==========================================
        async function controllaSessione() {
            try {
                const risposta = await fetch('../api/me.php');
                const utente = await risposta.json();
                const menu = document.getElementById('menu-utente');

                if (utente.loggato) {
                    menu.innerHTML = `
                        <span class="navbar-text text-white me-3">Ciao, <b>${utente.nome}</b>!</span>
                        <a href="carrello.html" class="btn btn-warning me-2">🛒 CARRELLO</a>
                        <button onclick="eseguiLogout()" class="btn btn-outline-danger">ESCI</button>
                    `;
                } else {
                    menu.innerHTML = `
                        <a href="login.html" class="btn btn-outline-light me-2">LOGIN</a>
                        <a href="registrazione.html" class="btn btn-outline-light me-2">REGISTRATI</a>
                        <a href="carrello.html" class="btn btn-warning">🛒 CARRELLO</a>
                    `;
                }
            } catch (errore) {
                console.log("Errore sessione.");
            }
        }

        async function eseguiLogout() {
            await fetch('../api/logout.php');
            window.location.href = 'index.html';
        }

        // ==========================================
        // 2. CARICAMENTO DEL PRODOTTO CON COLORI DARK
        // ==========================================
        async function caricaDettaglio() {
            if (!idProdotto) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const risposta = await fetch(`../api/prodotto.php?id=${idProdotto}`);
                const prodotto = await risposta.json();

                if (!risposta.ok) throw new Error(prodotto.errore);

                document.title = `${prodotto.nome} - TH-Guitars`;

                const contenitore = document.getElementById('dettaglio-prodotto');
                
                // Tutto adattato al nero, grigio e rosso
                contenitore.innerHTML = `
                    <div class="col-md-6 text-center">
                        <img src="${prodotto.immagine_url}" class="img-fluid rounded mb-3" style="max-height: 500px; background-color: #2a2a2a; padding: 20px; border: 1px solid #333;" alt="${prodotto.nome}">
                    </div>
                    <div class="col-md-6">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="index.html" class="text-secondary text-decoration-none">Catalogo</a></li>
                                <li class="breadcrumb-item active text-light">${prodotto.nome_categoria}</li>
                            </ol>
                        </nav>
                        <h1 class="display-5 fw-bold text-white text-uppercase">${prodotto.nome}</h1>
                        <h2 class="my-4 fw-bold" style="color: #d90429;">€ ${prodotto.prezzo}</h2>
                        <p class="lead mb-4" style="color: #bbbbbb;">${prodotto.descrizione}</p>
                        
                        <div class="alert border-secondary text-light" style="background-color: #222;">
                            <strong>Disponibilità:</strong> ${prodotto.giacenza} pezzi in magazzino (Pronta consegna)
                        </div>

                        <button class="btn btn-success btn-lg w-100 py-3 mt-3 fw-bold" onclick="aggiungiAlCarrello(${prodotto.id_prodotto})">
                            AGGIUNGI AL CARRELLO
                        </button>
                    </div>
                `;
            } catch (errore) {
                document.getElementById('dettaglio-prodotto').innerHTML = `<div class="alert alert-danger bg-dark border-danger text-danger">Errore: ${errore.message}</div>`;
            }
        }

        async function aggiungiAlCarrello(id) {
            const risposta = await fetch('../api/carrello.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_prodotto: id })
            });
            if (risposta.ok) {
                alert("🎸 Aggiunto al carrello!");
            }
        }

        // All'avvio della pagina, lanciamo ENTRAMBE le funzioni!
        controllaSessione();
        caricaDettaglio();
    </script>
</body>
</html>
