<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Prodotto - Thomann Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 Thomann Clone</a>
            <div class="d-flex" id="menu-utente">
                <a href="login.html" class="btn btn-outline-light me-2">Login</a>
                <a href="carrello.html" class="btn btn-warning">🛒 Carrello</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row bg-white p-4 shadow-sm rounded" id="dettaglio-prodotto">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p>Caricamento dettagli strumento...</p>
            </div>
        </div>
    </div>

    <script>
        // Funzione per leggere i parametri dall'URL (es. ?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const idProdotto = urlParams.get('id');

        async function caricaDettaglio() {
            if (!idProdotto) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const risposta = await fetch(`../api/prodotto.php?id=${idProdotto}`);
                const prodotto = await risposta.json();

                if (!risposta.ok) throw new Error(prodotto.errore);

                document.title = `${prodotto.nome} - Thomann Clone`;

                const contenitore = document.getElementById('dettaglio-prodotto');
                contenitore.innerHTML = `
                    <div class="col-md-6 text-center">
                        <img src="${prodotto.immagine_url}" class="img-fluid rounded mb-3" style="max-height: 500px;" alt="${prodotto.nome}">
                    </div>
                    <div class="col-md-6">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="index.html">Catalogo</a></li>
                                <li class="breadcrumb-item active">${prodotto.nome_categoria}</li>
                            </ol>
                        </nav>
                        <h1 class="display-5 fw-bold">${prodotto.nome}</h1>
                        <h2 class="text-primary my-4">€ ${prodotto.prezzo}</h2>
                        <p class="lead text-muted mb-4">${prodotto.descrizione}</p>
                        
                        <div class="alert alert-info">
                            <strong>Disponibilità:</strong> ${prodotto.giacenza} pezzi in magazzino (Pronta consegna)
                        </div>

                        <button class="btn btn-success btn-lg w-100 py-3 mt-3" onclick="aggiungiAlCarrello(${prodotto.id_prodotto})">
                            Aggiungi al Carrello
                        </button>
                    </div>
                `;
            } catch (errore) {
                document.getElementById('dettaglio-prodotto').innerHTML = `<div class="alert alert-danger">Errore: ${errore.message}</div>`;
            }
        }

        // Riutilizziamo la tua funzione carrello
        async function aggiungiAlCarrello(id) {
            const risposta = await fetch('../api/carrello.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_prodotto: id })
            });
            if (risposta.ok) alert("🎸 Aggiunto al carrello!");
        }

        caricaDettaglio();
    </script>
</body>
</html>
