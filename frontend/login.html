<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - Thomann Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">🎸 Thomann Clone</a>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4">Accedi</h3>
                    <div id="messaggio-alert"></div>
                    <form id="formLogin">
                        <div class="mb-3"><input type="email" class="form-control" id="email" placeholder="Email" required></div>
                        <div class="mb-4"><input type="password" class="form-control" id="password" placeholder="Password" required></div>
                        <button type="submit" class="btn btn-success w-100">Entra</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(event) {
            event.preventDefault();
            const dati = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            const box = document.getElementById('messaggio-alert');
            
            try {
                const risposta = await fetch('../api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dati)
                });
                const risultato = await risposta.json();

                if (risposta.ok) {
                    box.innerHTML = `<div class="alert alert-success">${risultato.messaggio}</div>`;
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    box.innerHTML = `<div class="alert alert-danger">${risultato.errore}</div>`;
                }
            } catch (err) {
                box.innerHTML = `<div class="alert alert-danger">Errore di rete.</div>`;
            }
        });
    </script>
</body>
</html>
